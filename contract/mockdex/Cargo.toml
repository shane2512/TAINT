[package]
name = "mockdex"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Testnet stand-in for a DEX: records buy() calls. NEAR Intents has no testnet."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
