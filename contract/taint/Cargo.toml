[package]
name = "taint"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "taint.near: provenance-gated policy contract for AI agent wallets"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.26.1"
shade-attestation = "0.2.0"
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "=5.26.1", features = ["unit-testing"] }
